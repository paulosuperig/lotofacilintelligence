name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Typecheck, testes e lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile
        env:
          SKIP_SUPABASE_VALIDATION: '1'

      - name: Typecheck (gate)
        run: bun run typecheck

      - name: Testes (gate)
        run: bun run test

      # Lint é informativo: o projeto ainda carrega avisos legados (ex.: nos
      # componentes shadcn gerados). Não bloqueia o merge, mas fica visível.
      - name: Lint (informativo)
        run: bun run lint
        continue-on-error: true
