name: Deploy Supabase Functions

# Deploya as Edge Functions do Supabase automaticamente quando algo em
# supabase/functions muda no main. O frontend é publicado pela Vercel; as
# functions NÃO sobem por lá — este workflow fecha essa lacuna.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'
  # Permite disparo manual pela aba Actions (ex.: primeira publicação).
  workflow_dispatch:

# Uma publicação por vez; cancela runs antigos se um novo push chegar.
concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy edge functions
    runs-on: ubuntu-latest
    # Não roda em forks (que não têm acesso ao secret).
    if: github.repository == 'paulosuperig/lotofacilintelligence'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: wevgcjgutpdazhqkhzhm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Guard — exige o secret SUPABASE_ACCESS_TOKEN
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN ausente. Cadastre em Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      # Deploya TODAS as functions do repo, respeitando o supabase/config.toml
      # (ex.: verify_jwt de cada função). Idempotente.
      - name: Deploy functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
